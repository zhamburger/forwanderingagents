name: Publish MCP registry metadata
on:
  push:
    branches: [main]
    paths: [server.json, .github/workflows/publish-mcp.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-registry-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zhamburger/forwanderingagents' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Check out the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify this version is live before advertising it
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          expected = json.load(open('server.json'))['version']
          for attempt in range(60):
              try:
                  request = urllib.request.Request('https://forwanderingagents.com/api/status', headers={'User-Agent':'Owner-authorized-verification/1.0', 'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      status = json.load(response)
                  if status.get('version') == expected:
                      print('Confirmed live version:', expected)
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Expected version is not live; registry publication stopped')
          PY
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the pinned registry publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          release_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$release_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$release_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate using this repository's short-lived identity
        run: ./mcp-publisher login github-oidc --registry https://registry.modelcontextprotocol.io
      - name: Publish the versioned manifest
        run: ./mcp-publisher publish --registry https://registry.modelcontextprotocol.io
